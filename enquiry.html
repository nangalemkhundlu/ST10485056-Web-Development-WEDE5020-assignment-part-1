    <main>

<section class="page-title">
    <h2>Make an Enquiry</h2>
    <p>Request a quotation or book a service with Sisonke Auto Care.</p>
</section>

<section class="form-section">
    <div class="form-container">

        <form action="#" method="post">

            <div class="form-row">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email address"
                        required
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="vehicle">Vehicle Make & Model</label>
                    <input 
                        type="text" 
                        id="vehicle" 
                        name="vehicle" 
                        placeholder="e.g. Toyota Corolla"
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="service">Select Service</label>

                <select id="service" name="service" required>
                    <option value="">-- Select a Service --</option>
                    <option value="servicing">Vehicle Servicing</option>
                    <option value="brakes">Brake Repairs</option>
                    <option value="diagnostics">Engine Diagnostics</option>
                    <option value="maintenance">General Maintenance</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea 
                    id="message" 
                    name="message"
                    rows="6"
                    placeholder="Tell us about your vehicle or the service you need..."
                ></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Enquiry
            </button>

        </form>

    </div>
</section>

    </main>

</html>
