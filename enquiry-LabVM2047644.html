    <main>

<section class="page-title">
    <h2>Make an Enquiry</h2>
    <p>Request a quotation or book a service.</p>
</section>

<section class="form-section">
    <form action="#" method="post">

        <div class="form-group">
            <label for="name">Full Name & Last Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
            <label for="vehicle">Vehicle Make and Model:</label>
            <input type="text" id="vehicle" name="vehicle">
        </div>

        <div class="form-group">
            <label for="service">Select Service:</label>
            <select id="service" name="service">
                <option value="">-- Select a Service --</option>
                <option value="servicing">Vehicle Servicing</option>
                <option value="brakes">Brake Repairs</option>
                <option value="diagnostics">Engine Diagnostics</option>
                <option value="maintenance">General Maintenance</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Tell us how we can help you..."
            ></textarea>
        </div>

        <button type="submit">Submit Enquiry</button>

    </form>
</section>

    </main>
